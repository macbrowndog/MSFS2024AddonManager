name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore MSFS2024AddonManager.slnx

      - name: Build
        run: dotnet build MSFS2024AddonManager.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MSFS2024AddonManager.slnx --configuration Release --no-build
